<!doctype html>
<html lang="zh-CN"><meta charset="utf-8">
<title>SKYBREAK · 驾驶员动态预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#060f1b;color:#def6fa;font:15px system-ui}
header,footer{max-width:1400px;margin:auto;padding:20px 28px}header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:23px;letter-spacing:.1em;margin:0}small{color:#8caab5}main{max-width:1400px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
article{min-width:0;background:radial-gradient(ellipse at 48% 30%,#183b4a 0%,#091626 68%);overflow:hidden}
canvas{display:block;width:100%;height:auto;aspect-ratio:2/3}h2{font-size:19px;margin:8px 22px;color:#90e7ec}p{margin:0 22px 22px;color:#94aab8;font-size:13px}
button{background:#183745;border:1px solid #416671;border-radius:5px;color:#d7f4f5;padding:9px 15px;cursor:pointer}
button:hover{background:#275561}footer{display:flex;flex-wrap:wrap;gap:12px;align-items:center}input{flex:1;min-width:120px;accent-color:#89f2f3}
#status{margin:0 28px 22px;font-size:13px;color:#9cb1c3;text-align:center}#error{color:#ff8f8f;white-space:pre-wrap}
</style>
<header><div><h1>SKYBREAK / 驾驶员动态</h1><small>动画工作预览 · 尚未完成 Unity 原生构建验证</small></div><small>转身 / 俯身 / 呼吸 / 惯性回弹</small></header>
<main>
<article><canvas width="480" height="720"></canvas><h2>苍凛 AOI / 24 岁</h2><p>沉着 · 稳定的呼吸与舒展动作</p></article>
<article><canvas width="480" height="720"></canvas><h2>绯音 RIN / 27 岁</h2><p>自信 · 更活泼的侧转与回弹</p></article>
<article><canvas width="480" height="720"></canvas><h2>雪璃 YUKI / 25 岁</h2><p>安静 · 轻微俯身与延迟随动</p></article>
</main>
<footer><button id="play">暂停</button><button id="reset">重新播放</button><input aria-label="预览时间" id="time" type="range" min="0" max="16" step="0.01" value="0"><span id="clock">0.00s</span><button id="capture">保存 16 秒预览帧</button></footer>
<div id="status">正在加载角色…</div><div id="error"></div>
<script src="rig.js"></script>
<script>
const canvases=[...document.querySelectorAll('canvas')],renderers=[];
const slider=document.querySelector('#time'),clock=document.querySelector('#clock'),status=document.querySelector('#status');
let playing=true,capturing=false,time=0,last=performance.now();
const vertex=`attribute vec2 aPos;varying vec2 vUV;void main(){vUV=(aPos+1.0)*.5;gl_Position=vec4(aPos,0.,1.);}`;
function shader(gl,type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
async function makeRenderer(canvas,pilot,fragment){
 const gl=canvas.getContext('webgl',{alpha:true,premultipliedAlpha:false,preserveDrawingBuffer:true,antialias:false});
 if(!gl)throw Error('当前浏览器无法使用 WebGL');
 const program=gl.createProgram();gl.attachShader(program,shader(gl,gl.VERTEX_SHADER,vertex));gl.attachShader(program,shader(gl,gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);
 if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
 const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
 const attribute=gl.getAttribLocation(program,'aPos');gl.enableVertexAttribArray(attribute);gl.vertexAttribPointer(attribute,2,gl.FLOAT,false,0,0);
 const stem=['Aoi','Rin','Yuki'][pilot];
 for(let n=0;n<2;n++){
  const img=new Image();img.src=`/Assets/Resources/Pilots/${stem}${n?'Blink':''}.png`;await img.decode();
  const tex=gl.createTexture();gl.activeTexture(gl.TEXTURE0+n);gl.bindTexture(gl.TEXTURE_2D,tex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.uniform1i(gl.getUniformLocation(program,n?'_BlinkTex':'_MainTex'),n);
 }
 const locations={};for(const key of Object.keys(sample(pilot,0)))locations[key]=gl.getUniformLocation(program,key);
 return t=>{gl.useProgram(program);const uniforms=sample(pilot,t);for(const [key,value] of Object.entries(uniforms)){
  if(Array.isArray(value))gl.uniform4fv(locations[key],value);else gl.uniform1f(locations[key],value);
 }gl.viewport(0,0,480,720);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);if(gl.getError()!==gl.NO_ERROR)throw Error('WebGL draw failed');};
}
function draw(t){renderers.forEach(r=>r(t));slider.value=t;clock.textContent=t.toFixed(2)+'s';}
function tick(now){if(!capturing){if(playing)time=(time+(now-last)/1000)%16;draw(time);}last=now;requestAnimationFrame(tick);}
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'暂停':'播放';};
document.querySelector('#reset').onclick=()=>{time=0;draw(time);};
slider.oninput=()=>{playing=false;document.querySelector('#play').textContent='播放';time=+slider.value;draw(time);};
document.querySelector('#capture').onclick=async()=>{
 if(capturing)return;capturing=true;const wasPlaying=playing;playing=false;
 const output=document.createElement('canvas');output.width=1440;output.height=844;const ctx=output.getContext('2d');
 try{for(let frame=0;frame<384;frame++){
  time=frame/24;draw(time);ctx.fillStyle='#071320';ctx.fillRect(0,0,1440,844);
  ctx.font='600 23px system-ui';ctx.fillStyle='#98e9ef';ctx.fillText('SKYBREAK / 驾驶员动态增强',28,37);
  ctx.font='15px system-ui';ctx.fillStyle='#98acbb';ctx.fillText('独立动画工作预览 · Unity 原生构建待验证',1000,36);
  canvases.forEach((c,i)=>{const gradient=ctx.createRadialGradient(i*480+240,280,30,i*480+240,350,520);gradient.addColorStop(0,'#163c49');gradient.addColorStop(1,'#071320');ctx.fillStyle=gradient;ctx.fillRect(i*480,56,480,720);ctx.drawImage(c,i*480,56);ctx.font='600 20px system-ui';ctx.fillStyle='#a1e8eb';ctx.fillText(['苍凛 AOI · 24 岁','绯音 RIN · 27 岁','雪璃 YUKI · 25 岁'][i],i*480+30,809);});
  const blob=await new Promise(resolve=>output.toBlob(resolve,'image/jpeg',.92));
  const response=await fetch('/__portrait_frame/'+String(frame).padStart(4,'0')+'.jpg',{method:'POST',body:blob});if(!response.ok)throw Error('保存帧失败 '+response.status);
  status.textContent=`正在保存预览 ${frame+1} / 384`;if(frame%12===0)await new Promise(r=>setTimeout(r,0));
 }status.textContent='已保存 384 帧 / 16 秒独立预览；Unity 原生验证仍待完成。';
 }catch(e){document.querySelector('#error').textContent=e.stack;}finally{capturing=false;playing=wasPlaying;last=performance.now();}
};
(async()=>{const fragment=await (await fetch('fragment.glsl')).text();for(let i=0;i<3;i++)renderers.push(await makeRenderer(canvases[i],i,fragment));status.textContent='动作循环包含侧转、俯身回正、呼吸与回弹。可暂停或拖动时间检查。';last=performance.now();requestAnimationFrame(tick);})().catch(e=>document.querySelector('#error').textContent=e.stack);
</script></html>
